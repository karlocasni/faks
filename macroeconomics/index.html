<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macroeconomics · faks</title>
<meta name="description" content="Macroeconomics study scripts: theory and worked tutorial exercises.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<!-- To create a new subject: copy this file to <subject-id>/index.html and change data-subject below and in #site-nav. -->
<div id="site-nav" data-root="../" data-current="macroeconomics/"></div>
<main class="wrap" id="subject" data-subject="macroeconomics">
  <div class="crumbs"><a href="../">faks</a> / <span id="crumb"></span></div>
  <header class="hub-hero" style="padding-top:28px">
    <div class="eyebrow" id="source"></div>
    <h1 id="name"></h1>
  </header>
  <div class="list-h">Scripts</div>
  <div class="cards" id="scripts"></div>
  <footer class="site">New scripts appear here as they are added.</footer>
</main>
<script src="../assets/catalog.js"></script>
<script src="../assets/nav.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var id = document.getElementById('subject').getAttribute('data-subject');
  var sub = window.FAKS_CATALOG.filter(function (s) { return s.id === id; })[0];
  if (!sub) return;
  document.title = sub.name + ' · faks';
  document.getElementById('crumb').textContent = sub.name;
  document.getElementById('name').textContent = sub.name;
  document.getElementById('source').textContent = sub.source;
  var host = document.getElementById('scripts');
  host.innerHTML = sub.scripts.length ? sub.scripts.map(function (s) {
    return '<a class="card" href="' + s.href + '">' +
      '<span class="k">' + esc(s.chapters) + (s.exercises ? ' · ' + s.exercises + ' worked exercises' : '') + '</span>' +
      '<h3>' + esc(s.title) + '</h3>' +
      '<div class="tags">' + (s.topics || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<span class="go">Open script →</span></a>';
  }).join('') : '<p class="empty">No scripts yet.</p>';
})();
</script>
</body>
</html>
